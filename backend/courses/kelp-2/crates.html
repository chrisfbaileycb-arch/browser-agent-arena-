<style>
  .dock { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; }
  .pile, .stack { min-height: 260px; border-radius: 16px; padding: 14px; border: 2px dashed rgba(88, 224, 200, .35);
    background: rgba(6, 31, 42, .5); transition: background-color .15s ease, border-color .15s ease; }
  .stack { display: flex; flex-direction: column-reverse; gap: 8px; border-color: rgba(255, 209, 102, .55);
    background: rgba(255, 209, 102, .07); }
  .stack.over { background: rgba(255, 209, 102, .18); border-color: var(--sun); }
  .crate { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px;
    margin-bottom: 10px; border-radius: 12px; cursor: grab;
    background: linear-gradient(165deg, #8a5a2c, #6d4420); color: #fff3e2;
    border: 2px solid rgba(6, 31, 42, .65); box-shadow: 0 5px 0 rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .18);
    transition: transform .12s ease, box-shadow .12s ease; }
  .crate:hover { transform: translateY(-2px); box-shadow: 0 7px 0 rgba(0, 0, 0, .35); }
  .crate span { font-weight: 700; }
  .crate span::before { content: "▣"; margin-right: 9px; color: var(--sun); }
  .crate .btn { padding: 5px 12px; font-size: 12.5px; border-color: #fff3e2; color: #fff3e2;
    background: rgba(255, 255, 255, .08); box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
  .crate .btn:hover { background: rgba(255, 255, 255, .16); }
  .stack .crate { margin: 0; cursor: default; background: linear-gradient(165deg, #2fae7f, #1c7a58); }
  .stack .crate:hover { transform: none; }
  .dock h3 { margin: 0 0 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
</style>
<section class="board" id="stage">
  <div class="station-tag">Station 4 · Crate Stack</div>
  <h1>The Crate Stack</h1>
</section>
<script>
(function () {
  var P = Course.P, I = P.ids, E = Course.el, stage = Course.stage(), placed = [];
  stage.appendChild(E("p", { class: "lede", text: P.rule + " Drag each crate onto the stack, or use its \"Place on stack\" button. Then seal the stack." }));
  var pile = E("div", { class: "pile " + I.a, id: I.b }, [E("h3", { text: "Crates on the sea floor" })]);
  var stack = E("div", { class: "stack " + I.c, id: I.d, "aria-label": "Stack (bottom first)" });
  var seal = E("button", { id: I.e, class: "btn go " + I.f, type: "button", text: "Seal the stack", disabled: true, on: function () {
    Course.clear(placed.join(",")).then(function (d) { if (!d) reset(); });
  } });
  var undo = E("button", { id: I.g, class: "btn " + I.h, type: "button", text: "Restack from scratch", on: function () { reset(); } });
  var place = function (c, node) {
    if (placed.indexOf(c.id) >= 0) return;
    placed.push(c.id);
    stack.appendChild(E("div", { class: "crate" }, [E("span", { text: (placed.length) + ". " + c.name + " · " + c.kg + " kg" })]));
    node.remove();
    seal.disabled = placed.length !== P.crates.length;
  };
  var draw = function () {
    P.crates.forEach(function (c) {
      var node = E("div", { class: "crate " + c.id, draggable: "true", "data-kg": c.kg }, [E("span", { text: c.name + " · " + c.kg + " kg" })]);
      node.appendChild(E("button", { type: "button", class: "btn", text: "Place on stack", "aria-label": "Place " + c.name + " (" + c.kg + " kg) on stack", on: function () { place(c, node); } }));
      node.addEventListener("dragstart", function (ev) { ev.dataTransfer.setData("text/plain", c.id); });
      node._crate = c;
      pile.appendChild(node);
    });
  };
  var reset = function () {
    placed = []; stack.innerHTML = ""; seal.disabled = true;
    Array.prototype.slice.call(pile.querySelectorAll(".crate")).forEach(function (n) { n.remove(); });
    draw();
  };
  stack.addEventListener("dragover", function (ev) { ev.preventDefault(); stack.classList.add("over"); });
  stack.addEventListener("dragleave", function () { stack.classList.remove("over"); });
  stack.addEventListener("drop", function (ev) {
    ev.preventDefault(); stack.classList.remove("over");
    var id = ev.dataTransfer.getData("text/plain");
    var node = Array.prototype.slice.call(pile.querySelectorAll(".crate")).filter(function (n) { return n._crate && n._crate.id === id; })[0];
    if (node) place(node._crate, node);
  });
  stage.appendChild(E("div", { class: "dock" }, [pile, E("div", {}, [E("h3", { text: "Stack (bottom first)" }), stack])]));
  stage.appendChild(E("div", { class: "row" }, [seal, undo]));
  draw();
})();
</script>
