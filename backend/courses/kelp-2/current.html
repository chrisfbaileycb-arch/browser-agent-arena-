<style>
  .stream { height: 330px; overflow-y: auto; border: 2px solid var(--line); border-radius: 16px; padding: 12px;
    background: rgba(6, 31, 42, .55); margin-top: 12px; box-shadow: inset 0 12px 28px -16px rgba(0, 0, 0, .7); }
  .buoy { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px;
    margin-bottom: 8px; border-radius: 13px; background: rgba(14, 92, 110, .5); border: 1px solid var(--line);
    transition: transform .12s ease, border-color .12s ease; }
  .buoy:hover { transform: translateY(-2px); border-color: rgba(88, 224, 200, .5); }
  .buoy span { font-family: var(--mono); font-size: 15px; letter-spacing: .08em; }
  .buoy span::before { content: "◉"; color: var(--glow); margin-right: 9px; }
  .buoy .btn { padding: 6px 14px; font-size: 14px; }
  .loading { text-align: center; font-family: var(--mono); font-size: 11.5px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-soft); padding: 12px; }
  .loading::after { content: "…"; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 50% { opacity: .3; } }
</style>
<section class="board" id="stage">
  <div class="station-tag">Station 2 · The Current</div>
  <h1>The Current</h1>
</section>
<script>
(function () {
  var P = Course.P, I = P.ids, E = Course.el, stage = Course.stage();
  stage.appendChild(E("p", { class: "lede", text: "Somewhere down this current floats the buoy tagged " + P.target + ". The current only brings more buoys when you scroll to its end. " + P.verb + " that buoy and no other." }));
  stage.appendChild(E("button", { id: I.c, class: "btn flashy " + I.d, type: "button", text: P.verb + " the nearest buoy", on: function () { Course.decoy("The nearest buoy is not yours."); } }));
  var list = E("div", { class: "stream " + I.a, id: I.b, "aria-label": "Ocean current (scroll for more buoys)", tabindex: "0" });
  var loader = E("div", { class: "loading", text: "Scroll down for more buoys" });
  stage.appendChild(list);
  var shown = 0, loading = false;
  var more = function () {
    P.tags.slice(shown, shown + P.batch).forEach(function (t) {
      list.insertBefore(E("div", { class: "buoy " + I.e }, [E("span", { text: "Buoy " + t }),
        E("button", { type: "button", class: "btn " + I.f, text: P.verb, "aria-label": P.verb + " buoy " + t, on: function () { Course.clear(t); } })]), loader);
    });
    shown += P.batch;
    if (shown >= P.tags.length) loader.textContent = "End of the current.";
    loading = false;
  };
  list.appendChild(loader);
  more();
  list.addEventListener("scroll", function () {
    if (!loading && shown < P.tags.length && list.scrollTop + list.clientHeight >= list.scrollHeight - 60) { loading = true; setTimeout(more, 250); }
  });
})();
</script>
