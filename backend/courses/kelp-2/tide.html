<style>
  .gate { margin: 16px 0; padding: 22px 18px; border-radius: 16px; font-family: var(--mono); font-size: 19px;
    letter-spacing: .12em; text-align: center; border: 2px solid var(--line);
    transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease; }
  .gate.open { background: rgba(47, 174, 127, .28); border-color: var(--kelp); color: #d8ffe9;
    box-shadow: 0 0 34px rgba(47, 174, 127, .35); }
  .gate.shut { background: rgba(217, 83, 47, .16); border-color: rgba(255, 122, 89, .5); color: #ffc8b6; }
  .gate::before { content: "◈"; display: block; font-size: 16px; margin-bottom: 8px; opacity: .8; }
  .tide-hint { margin: 14px 0 0; font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--ink-soft); }
</style>
<section class="board" id="stage">
  <div class="station-tag">Station 5 · Tide Gate</div>
  <h1>The Tide Gate</h1>
  <p class="lede">The gate only opens when the tide rolls in, for a few seconds at a time. Wait for it to open,
    then swim through. Forcing it never works.</p>
</section>
<script>
(function () {
  var P = Course.P, I = P.ids, E = Course.el, stage = Course.stage();
  var status = E("div", { class: "gate " + I.a, id: I.b, role: "status", "aria-live": "polite" });
  var swim = E("button", { id: I.c, class: "btn go " + I.d, type: "button", text: P.swim, disabled: true, on: function () { if (isOpen()) Course.clear(); } });
  var bait = E("button", { id: I.e, class: "btn flashy " + I.f, type: "button", text: P.bait, on: function () { Course.decoy("The gate can't be forced."); } });
  var phase = function () { return (Date.now() / 1000 + P.offset) % P.cycle_s; };
  var isOpen = function () { return phase() < P.open_s; };
  var tick = function () {
    var p = phase(), open = p < P.open_s;
    status.className = "gate " + I.a + (open ? " open" : " shut");
    status.textContent = open ? "TIDE GATE: OPEN · closes in " + Math.ceil(P.open_s - p) + "s" : "TIDE GATE: CLOSED · opens in " + Math.ceil(P.cycle_s - p) + "s";
    swim.disabled = !open;
  };
  stage.appendChild(status);
  stage.appendChild(E("div", { class: "row" }, P.offset % 2 ? [swim, bait] : [bait, swim]));
  tick(); setInterval(tick, 200);
})();
</script>
