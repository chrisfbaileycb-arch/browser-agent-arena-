<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — The Tidepool Gauntlet</title>
<script id="course-config" type="application/json">{{CONFIG}}</script>
<style>
  :root {
    --ink: #123037; --ink-soft: #3d5c63; --sand: #f2e7d3; --paper: #fffbf2;
    --sea: #0e4c5c; --sea-deep: #0a3742; --lagoon: #17788c; --kelp: #2f7d5f;
    --coral: #e4572e; --coral-deep: #b93f1d; --sun: #f2a03d; --sun-soft: #ffd9a0;
    --line: rgba(18, 48, 55, .16); --shadow: 0 24px 48px -28px rgba(10, 55, 66, .55);
    --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; font-family: var(--sans); color: var(--ink); line-height: 1.6;
    background:
      radial-gradient(1200px 460px at 82% -8%, rgba(242, 160, 61, .38), transparent 62%),
      radial-gradient(900px 380px at 8% 6%, rgba(23, 120, 140, .18), transparent 60%),
      var(--sand);
    background-attachment: fixed;
  }
  ::selection { background: var(--sun-soft); }

  /* ---------- scenery ---------- */
  .horizon { position: absolute; inset: 0 0 auto 0; height: 340px; overflow: hidden; pointer-events: none; z-index: 0; }
  .horizon .sun { position: absolute; top: 46px; right: 12%; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #ffe9c2, var(--sun) 62%, #e07f2a); opacity: .9;
    box-shadow: 0 0 90px 34px rgba(242, 160, 61, .38); }
  .horizon .cliff { position: absolute; bottom: -2px; height: 190px; }
  .horizon .cliff-a { left: -4%; width: 46%; background: var(--sea); opacity: .92;
    clip-path: polygon(0 42%, 12% 26%, 26% 34%, 41% 14%, 58% 30%, 74% 20%, 88% 36%, 100% 28%, 100% 100%, 0 100%); }
  .horizon .cliff-b { right: -4%; width: 52%; background: var(--sea-deep); opacity: .85;
    clip-path: polygon(0 30%, 14% 42%, 30% 22%, 47% 38%, 63% 18%, 80% 34%, 100% 20%, 100% 100%, 0 100%); }
  .horizon .surf { position: absolute; left: 0; right: 0; bottom: -12px; height: 84px; opacity: .5;
    background:
      radial-gradient(60px 30px at 30px 30px, rgba(255, 255, 255, .85) 68%, transparent 70%) 0 0 / 120px 60px repeat-x,
      linear-gradient(transparent 40%, rgba(23, 120, 140, .28) 42% 100%); }

  /* ---------- HUD ---------- */
  .hud { position: relative; z-index: 3; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center;
    justify-content: space-between; padding: 20px clamp(18px, 4vw, 44px) 16px;
    background: linear-gradient(180deg, rgba(10, 55, 66, .96), rgba(10, 55, 66, .9)); color: #f6efe2;
    border-bottom: 3px solid var(--coral); box-shadow: 0 18px 40px -26px rgba(10, 55, 66, .9); }
  .brand small { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .32em;
    text-transform: uppercase; color: var(--sun-soft); }
  .brand strong { display: block; margin-top: 3px; font-size: clamp(19px, 2.6vw, 25px); font-weight: 800;
    letter-spacing: .045em; text-transform: uppercase; line-height: 1.1; }
  .brand strong i { font-style: normal; color: var(--sun); }
  .hud-chips { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px;
    letter-spacing: .06em; padding: 9px 14px; border-radius: 999px; border: 1.5px solid rgba(246, 239, 226, .28);
    background: rgba(246, 239, 226, .1); color: #f6efe2; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--kelp); box-shadow: 0 0 10px currentColor; }
  .chip .lbl::before { content: attr(data-l); text-transform: uppercase; }
  .chip b { font-variant-numeric: tabular-nums; font-size: 15px; letter-spacing: .12em; }
  .chip.decoys.hit { border-color: var(--coral); background: rgba(228, 87, 46, .22); }
  .chip.decoys.hit .dot { background: var(--coral); animation: pulse 1.1s ease-in-out infinite; }
  .chip.timer .dot { background: var(--sun); }

  /* ---------- trail map ---------- */
  #course-map { position: relative; z-index: 3; display: flex; gap: 8px; padding: 14px clamp(18px, 4vw, 44px);
    flex-wrap: wrap; background: rgba(255, 251, 242, .72); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); }
  .post { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); padding: 7px 13px 7px 7px;
    border-radius: 999px; border: 1.5px dashed rgba(18, 48, 55, .28); background: rgba(255, 251, 242, .8);
    transition: transform .18s ease, background-color .18s ease, border-color .18s ease, color .18s ease; }
  .post b { display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 50%;
    background: rgba(18, 48, 55, .12); color: var(--ink); font-size: 11px; font-weight: 700; }
  .post.done { background: rgba(47, 125, 95, .16); border-color: var(--kelp); color: var(--kelp); }
  .post.done b { background: var(--kelp); color: #fff; }
  .post.here { background: var(--ink); border-color: var(--ink); border-style: solid; color: var(--paper);
    transform: translateY(-2px); box-shadow: 0 10px 18px -12px rgba(18, 48, 55, .8); }
  .post.here b { background: var(--coral); color: #fff; animation: pulse 1.6s ease-in-out infinite; }

  /* ---------- page frame ---------- */
  main { position: relative; z-index: 2; max-width: 1020px; margin: 0 auto; padding: 26px clamp(16px, 4vw, 32px) 56px; }
  #toast { min-height: 30px; margin-bottom: 16px; }
  #toast:not(:empty) { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono);
    font-size: 13.5px; font-weight: 700; letter-spacing: .04em; color: #fff; background: var(--coral-deep);
    padding: 11px 18px; border-radius: 14px; box-shadow: 0 16px 30px -18px rgba(185, 63, 29, .9);
    animation: slide-in .28s cubic-bezier(.2, .9, .3, 1.2); }
  #toast::before { content: "▲"; font-size: 11px; opacity: .85; }

  .board { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    padding: clamp(22px, 3.6vw, 38px); box-shadow: var(--shadow); overflow: hidden; }
  .board::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 7px;
    background: linear-gradient(90deg, var(--coral), var(--sun) 38%, var(--lagoon) 72%, var(--kelp)); }
  .board.notice { border-color: rgba(228, 87, 46, .5); }
  .board.notice::before { background: var(--coral); }
  .station-tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px;
    letter-spacing: .22em; text-transform: uppercase; color: var(--coral-deep); }
  .station-tag::before { content: ""; width: 22px; height: 2px; background: var(--coral); }
  h1 { margin: 10px 0 6px; font-size: clamp(28px, 4.6vw, 42px); line-height: 1.05; letter-spacing: -.015em;
    font-weight: 800; }
  h3 { margin: 18px 0 8px; font-size: 16px; letter-spacing: .02em; }
  p { line-height: 1.65; margin: 8px 0 14px; max-width: 62ch; }
  .lede { font-size: 17.5px; color: var(--ink-soft); }
  ul.rules { list-style: none; margin: 18px 0 8px; padding: 0; display: grid; gap: 10px; max-width: 62ch; }
  ul.rules li { position: relative; padding: 12px 16px 12px 46px; border-radius: 14px;
    background: rgba(23, 120, 140, .08); border: 1px solid rgba(23, 120, 140, .18); }
  ul.rules li::before { content: counter(list-item); counter-increment: list-item; position: absolute; left: 13px;
    top: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--sea); color: var(--sun-soft);
    font-family: var(--mono); font-size: 12px; display: grid; place-items: center; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; align-items: center; }

  /* ---------- buttons ---------- */
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--lagoon); outline-offset: 3px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; font-size: 16px;
    font-weight: 700; letter-spacing: .01em; padding: 13px 22px; border-radius: 15px; border: 2px solid var(--ink);
    background: var(--paper); color: var(--ink); text-decoration: none;
    box-shadow: 0 5px 0 var(--ink); transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.go { background: var(--coral); color: #fff; }
  .btn.go:hover { background: var(--coral-deep); }
  .btn.flashy { background: var(--sun); color: var(--ink); }
  .btn.flashy:hover { background: #e6912f; }
  .btn:disabled { opacity: .48; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 var(--ink); }

  /* ---------- station widgets ---------- */
  .chip-tag { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); }
  .stat-strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 2px; }
  .stat-strip .chip-tag { padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; }
  .hint { margin: 16px 0 0; padding: 13px 16px; border-left: 4px solid var(--sun); border-radius: 0 12px 12px 0;
    background: rgba(242, 160, 61, .12); font-size: 14.5px; color: var(--ink-soft); }
  .hint b { color: var(--ink); }

  main.shake { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }
  .stamp { position: fixed; z-index: 80; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .stamp i { font-style: normal; font-family: var(--mono); font-size: 22px; letter-spacing: .34em;
    text-transform: uppercase; color: #fff; background: var(--kelp); border: 3px solid #fff;
    padding: 22px 34px; border-radius: 18px; transform: rotate(-7deg); box-shadow: 0 30px 60px -20px rgba(10, 55, 66, .6);
    animation: stamp-in .5s cubic-bezier(.2, .9, .3, 1.35); }

  footer.marshal { position: relative; z-index: 2; max-width: 1020px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px) 40px;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
  footer.marshal span { display: inline-block; padding-top: 12px; border-top: 1px solid var(--line); }

  @keyframes pulse { 50% { transform: scale(1.35); opacity: .55; } }
  @keyframes slide-in { from { opacity: 0; transform: translateY(-10px) scale(.96); } }
  @keyframes stamp-in { from { opacity: 0; transform: rotate(-7deg) scale(1.7); } to { opacity: 1; } }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(5px); }
    30%, 50%, 70% { transform: translateX(-9px); } 40%, 60% { transform: translateX(9px); } }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; } }
  /* compact rhythm: keeps each station inside the 1280x800 agent viewport, like the original pages */
  .hud { padding-top: 10px; padding-bottom: 10px; }
  #course-map { padding-top: 7px; padding-bottom: 7px; }
  main { padding-top: 10px; padding-bottom: 12px; }
  footer.marshal { padding-bottom: 8px; }
  .board { padding-top: 20px; padding-bottom: 20px; }
  h1 { margin: 4px 0 2px; font-size: clamp(26px, 3.4vw, 32px); }
  p { margin: 5px 0 9px; line-height: 1.5; }
  .lede { font-size: 16px; }
</style>
</head>
<body data-station="{{STATION}}" data-decoys="0">
<div class="horizon" aria-hidden="true">
  <div class="sun"></div><div class="cliff cliff-a"></div><div class="cliff cliff-b"></div><div class="surf"></div>
</div>
<header class="hud">
  <div class="brand">
    <small>Steps of Execution · Obstacle Course 01</small>
    <strong>The Tidepool <i>Gauntlet</i></strong>
  </div>
  <div class="hud-chips">
    <span class="chip decoys" id="decoy-chip" aria-hidden="true"><span class="dot"></span><span class="lbl" data-l="Decoys"></span><b id="decoy-count">0</b></span>
    <span class="chip timer"><span class="dot" aria-hidden="true"></span><span class="lbl" data-l="Elapsed" aria-hidden="true"></span><b id="timer">00:00</b></span>
  </div>
</header>
<nav id="course-map" aria-label="Course map"></nav>
<script>
window.Course = (function () {
  var cfg = JSON.parse(document.getElementById("course-config").textContent);
  var busy = false;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var say = function (msg) { document.getElementById("toast").textContent = msg; };
  var post = function (path) {
    return fetch("/api/course-attempts/" + cfg.attempt + path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ station: cfg.station, nonce: cfg.nonce })
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.detail || "Request failed"); return d; }); });
  };
  var map = function () {
    document.getElementById("course-map").innerHTML = cfg.order.map(function (s, i) {
      var cls = cfg.cleared.indexOf(s) >= 0 ? "done" : i === cfg.index ? "here" : "";
      return '<span class="post ' + cls + '"><b>' + (i + 1) + "</b>" + cfg.names[i] + "</span>";
    }).join("");
  };
  var decoyChip = function () {
    document.body.dataset.decoys = String(cfg.decoys);
    document.getElementById("decoy-count").textContent = String(cfg.decoys);
    document.getElementById("decoy-chip").classList.toggle("hit", cfg.decoys > 0);
  };
  var shake = function () {
    if (reduced) return;
    var m = document.querySelector("main");
    m.classList.remove("shake");
    void m.offsetWidth;
    m.classList.add("shake");
  };
  var celebrate = function () {
    if (reduced) return;
    var s = document.createElement("div");
    s.className = "stamp";
    s.innerHTML = "<i>Station cleared</i>";
    document.body.appendChild(s);
    setTimeout(function () { s.remove(); }, 900);
  };
  map();
  decoyChip();
  if (cfg.started_at) {
    var t0 = Date.parse(cfg.started_at), tick = function () {
      var s = Math.max(0, Math.floor((Date.now() - t0) / 1000));
      document.getElementById("timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    };
    tick(); setInterval(tick, 1000);
  }
  return {
    cfg: cfg, say: say,
    clear: function () {
      if (busy) return Promise.resolve(null);
      busy = true;
      return post("/clear").then(function (d) {
        celebrate();
        if (d.next_path) {
          location.href = d.next_path;
        } else { cfg.cleared.push(cfg.station); map(); busy = false; }
        return d;
      }).catch(function (e) { busy = false; shake(); say(e.message); return null; });
    },
    decoy: function (msg) {
      return post("/decoy").then(function (d) {
        cfg.decoys = d.decoys;
        decoyChip();
        shake();
        say("TRAP! " + msg + " (decoys hit: " + d.decoys + ")");
      }).catch(function (e) { say(e.message); });
    }
  };
})();
</script>
<main>
  <div id="toast" role="alert" aria-live="assertive"></div>
  {{BODY}}
</main>
<footer class="marshal" aria-hidden="true"><span></span></footer>
</body>
</html>
