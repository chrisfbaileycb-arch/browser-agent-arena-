<style>
  #tunnel { overflow-x: auto; overflow-y: hidden; border: 4px solid #1f1a12; border-radius: 90px; background: #2b2b2b; }
  .tube { position: relative; width: 3200px; height: 190px;
    background: radial-gradient(circle at 3050px 95px, #ffd36b 0 40px, rgba(255,211,107,.25) 90px, transparent 160px), repeating-linear-gradient(90deg, #3a3a3a 0 60px, #333 60px 120px); }
  .tube .mark { position: absolute; top: 80px; color: #bbb; font-family: monospace; }
  .tube button { position: absolute; top: 70px; padding: 10px 16px; font-size: 15px; border-radius: 4px; border: 2px solid #111; }
  .side { background: #9a9a9a; }
  #lantern { background: #ffd36b; font-weight: bold; }
</style>
<section class="board">
  <div class="station-tag">Station 6 · The Tunnel</div>
  <h1>The Tunnel</h1>
  <p>Crawl through the tunnel to the lantern at the far right end. The tunnel scrolls sideways. Side passages and hatches along the way are dead ends.</p>
  <div id="tunnel" aria-label="The tunnel">
    <div class="tube">
      <span class="mark" style="left:40px">Entrance · crawl right &#8594;</span>
      <button class="side" type="button" style="left:760px">Side passage (up)</button>
      <button class="side" type="button" style="left:1560px">Brighter side passage</button>
      <button class="side" type="button" style="left:2320px">Shortcut hatch</button>
      <button id="lantern" type="button" style="left:2930px">Crawl out at the lantern</button>
    </div>
  </div>
</section>
<script>
(function () {
  [].forEach.call(document.querySelectorAll(".side"), function (b) {
    b.addEventListener("click", function () { Course.decoy(b.textContent + " was a dead end."); });
  });
  document.getElementById("lantern").addEventListener("click", function () { Course.clear(); });
})();
</script>
